name: Build LCMS PRO (Android + Desktop)

# Runs automatically every time you push code to the main branch.
# You can also trigger it manually from the GitHub "Actions" tab
# using the "Run workflow" button.
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  # Live, permanently published AI Studio app URL, baked into every build
  # so the packaged Android/Desktop apps can reach it (relative /api/...
  # paths only work inside AI Studio's own preview, not in an installed app).
  VITE_API_BASE_URL: https://lcms-pro-lightway1.ai.studio

jobs:
  # ------------------------------------------------------------------
  # ANDROID APK
  # ------------------------------------------------------------------
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Add Android platform
        run: npx cap add android || npx cap sync android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LCMS-PRO-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

  # ------------------------------------------------------------------
  # WINDOWS DESKTOP
  # ------------------------------------------------------------------
  windows:
    name: Build Windows Installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run electron:dist -- --win
      - uses: actions/upload-artifact@v4
        with:
          name: LCMS-PRO-Windows-Installer
          path: release/*.exe

  # ------------------------------------------------------------------
  # MACOS DESKTOP
  # ------------------------------------------------------------------
  macos:
    name: Build macOS Installer
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run electron:dist -- --mac
      - uses: actions/upload-artifact@v4
        with:
          name: LCMS-PRO-macOS-Installer
          path: release/*.dmg

  # ------------------------------------------------------------------
  # LINUX DESKTOP
  # ------------------------------------------------------------------
  linux:
    name: Build Linux Installer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run electron:dist -- --linux
      - uses: actions/upload-artifact@v4
        with:
          name: LCMS-PRO-Linux-Installer
          path: |
            release/*.AppImage
            release/*.deb
